name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (TypeScript チェック)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 依存パッケージのインストール
        run: npm ci

      - name: TypeScript 型チェック
        run: npx tsc --noEmit

      - name: テスト実行
        run: npm test

  frontend:
    name: Frontend (Vite ビルド)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 依存パッケージのインストール
        run: npm ci

      - name: ビルド
        run: npm run build

      - name: テスト実行
        run: npm test
